name: Note economique

on:
  schedule:
    # 06h10 UTC du lundi au vendredi (08h10 heure de Paris en ete, 07h10 en hiver)
    - cron: "10 6 * * 1-5"
  workflow_dispatch:      # bouton "Run workflow" pour lancer a la main

permissions:
  contents: write         # necessaire pour reecrire le carnet d'hypotheses
  pages: write
  id-token: write

concurrency:
  group: note
  cancel-in-progress: false

jobs:
  note:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Produire la note
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python brief.py

      - name: Enregistrer le carnet
        run: |
          git config user.name  "note-eco"
          git config user.email "actions@users.noreply.github.com"
          git add state/hypotheses.json notes index.html
          git diff --staged --quiet || git commit -m "Note du $(date -u +%Y-%m-%d)"
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - uses: actions/deploy-pages@v4
